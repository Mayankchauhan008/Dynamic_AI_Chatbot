<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Vibrant primary neon gradient -->
    <linearGradient id="primaryNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Secondary cyan-indigo glow gradient -->
    <linearGradient id="cyanIndigo" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle / Rounded Plate -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Ambient Light Reflection -->
  <ellipse cx="50" cy="18" rx="30" ry="10" fill="#6366f1" opacity="0.15" filter="blur(6px)"/>

  <!-- Dynamic Geometric "D" Symbol with Forward Neural Wave -->
  <g filter="url(#neonGlow)">
    <!-- Outer Dynamic Arch (representing D and momentum) -->
    <path d="M 28 22 C 48 20, 74 30, 74 50 C 74 70, 48 80, 28 78 L 28 66 C 42 66, 60 60, 60 50 C 60 40, 42 34, 28 34 Z" 
          fill="url(#primaryNeon)"/>

    <!-- Inner Forward Arrow / Dynamic Neural Bridge -->
    <path d="M 32 38 L 44 50 L 32 62 L 40 62 L 52 50 L 40 38 Z" 
          fill="url(#cyanIndigo)"/>

    <!-- Center Radiant Core Star / Intelligence Spark -->
    <path d="M 50 36 C 50 43, 57 50, 64 50 C 57 50, 50 57, 50 64 C 50 57, 43 50, 36 50 C 43 50, 50 43, 50 36 Z" 
          fill="#ffffff" opacity="0.9" filter="drop-shadow(0 0 5px #00f2fe)"/>

    <!-- Left Spine Accent with Tech Notch -->
    <rect x="22" y="24" width="6" height="52" rx="3" fill="url(#primaryNeon)"/>
    <circle cx="25" cy="50" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Micro Orbit particle dots -->
  <circle cx="76" cy="32" r="2" fill="#00f2fe" opacity="0.8"/>
  <circle cx="72" cy="68" r="1.8" fill="#ec4899" opacity="0.8"/>
</svg>
